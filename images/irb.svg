<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" role="img" aria-label="An irb session introducing Tony Duong, backend and AWS engineer at Spacely">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
    .prompt { fill: #ff6b81; }
    .code   { fill: #e6edf3; }
    .out    { fill: #7ee787; }
    .str    { fill: #a5d6ff; }
    .sym    { fill: #ffa657; }
    .cmt    { fill: #8b949e; }
    .title  { fill: #8b949e; font-size: 13px; }
    .cursor { fill: #ff6b81; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <!-- window -->
  <rect x="1" y="1" width="858" height="338" rx="12" fill="#0d1117" stroke="#30363d"/>
  <rect x="1" y="1" width="858" height="36" rx="12" fill="#161b22"/>
  <rect x="1" y="25" width="858" height="12" fill="#161b22"/>
  <circle cx="24" cy="19" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="19" r="6" fill="#febc2e"/>
  <circle cx="64" cy="19" r="6" fill="#28c840"/>
  <text x="430" y="24" text-anchor="middle" class="mono title">tony@tokyo — irb 🍓</text>

  <!-- each line is revealed left-to-right by its own clip rect -->
  <defs>
    <clipPath id="l1"><rect x="20" y="52" height="26" width="0"><animate attributeName="width" from="0" to="820" begin="0.3s" dur="1.2s" fill="freeze" calcMode="discrete" values="0;90;180;270;360;450;540;630;720;820"/></rect></clipPath>
    <clipPath id="l2"><rect x="20" y="78" height="26" width="0"><animate attributeName="width" begin="1.6s" dur="0.01s" to="820" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="20" y="116" height="26" width="0"><animate attributeName="width" begin="2.2s" dur="0.6s" fill="freeze" calcMode="discrete" values="0;80;160;240;820"/></rect></clipPath>
    <clipPath id="l4"><rect x="20" y="142" height="26" width="0"><animate attributeName="width" begin="2.9s" dur="0.01s" to="820" fill="freeze"/></rect></clipPath>
    <clipPath id="l5"><rect x="20" y="180" height="26" width="0"><animate attributeName="width" begin="3.5s" dur="0.7s" fill="freeze" calcMode="discrete" values="0;80;160;240;320;820"/></rect></clipPath>
    <clipPath id="l6"><rect x="20" y="206" height="26" width="0"><animate attributeName="width" begin="4.3s" dur="0.01s" to="820" fill="freeze"/></rect></clipPath>
    <clipPath id="l7"><rect x="20" y="244" height="26" width="0"><animate attributeName="width" begin="4.9s" dur="0.9s" fill="freeze" calcMode="discrete" values="0;80;160;240;320;400;480;820"/></rect></clipPath>
    <clipPath id="l8"><rect x="20" y="270" height="26" width="0"><animate attributeName="width" begin="5.9s" dur="0.01s" to="820" fill="freeze"/></rect></clipPath>
  </defs>

  <g class="mono">
    <text x="24" y="70" clip-path="url(#l1)"><tspan class="prompt">irb&gt; </tspan><tspan class="code">tony = </tspan><tspan class="sym">Engineer</tspan><tspan class="code">.find_by(handle: </tspan><tspan class="str">"tonystrawberry"</tspan><tspan class="code">)</tspan></text>
    <text x="24" y="96" clip-path="url(#l2)"><tspan class="out">=&gt; #&lt;Engineer name: "Tony Duong", born_in: "France", lives_in: "Japan"&gt;</tspan></text>

    <text x="24" y="134" clip-path="url(#l3)"><tspan class="prompt">irb&gt; </tspan><tspan class="code">tony.stack</tspan></text>
    <text x="24" y="160" clip-path="url(#l4)"><tspan class="out">=&gt; [</tspan><tspan class="sym">:ruby</tspan><tspan class="out">, </tspan><tspan class="sym">:rails</tspan><tspan class="out">, </tspan><tspan class="sym">:aws</tspan><tspan class="out">, </tspan><tspan class="sym">:terraform</tspan><tspan class="out">]</tspan></text>

    <text x="24" y="198" clip-path="url(#l5)"><tspan class="prompt">irb&gt; </tspan><tspan class="code">tony.currently</tspan></text>
    <text x="24" y="224" clip-path="url(#l6)"><tspan class="out">=&gt; </tspan><tspan class="str">"Backend / AWS Engineer @ Spacely"</tspan></text>

    <text x="24" y="262" clip-path="url(#l7)"><tspan class="prompt">irb&gt; </tspan><tspan class="code">tony.off_hours.sample(3)</tspan></text>
    <text x="24" y="288" clip-path="url(#l8)"><tspan class="out">=&gt; [</tspan><tspan class="str">"⚽ soccer"</tspan><tspan class="out">, </tspan><tspan class="str">"🏃 running"</tspan><tspan class="out">, </tspan><tspan class="str">"🎮 Pokémon"</tspan><tspan class="out">]  </tspan><tspan class="cmt"># also anime &amp; manga</tspan></text>

    <text x="24" y="320" opacity="0"><tspan class="prompt">irb&gt; </tspan><animate attributeName="opacity" begin="6.4s" dur="0.01s" to="1" fill="freeze"/></text>
    <g opacity="0"><animate attributeName="opacity" begin="6.4s" dur="0.01s" to="1" fill="freeze"/><rect class="cursor" x="70" y="306" width="9" height="18"/></g>
  </g>
</svg>
